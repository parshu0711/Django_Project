[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "core", "inventory", "operations", "personnel", "polarops", "research", "stations", "telemetry"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "*/migrations/*", "manage.py", "polarops/asgi.py", "polarops/wsgi.py"]
